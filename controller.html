<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Insect Bio-Robotics Panel</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      text-align: center;
      padding: 16px;
      background-color: #f0f2f5;
      color: #333;
    }
    .panel {
      background: white;
      border-radius: 14px;
      padding: 20px;
      max-width: 850px;
      margin: 12px auto;
      box-shadow: 0 2px 8px rgba(0,0,0,0.08);
    }
    .btn-connect { 
      background: #28a745; 
      color: white; 
      width: 100%; 
      max-width: 300px; 
      padding: 12px 20px;
      font-size: 18px;
      font-weight: 600;
      border: none;
      border-radius: 10px;
      cursor: pointer;
    }
    
    /* Dashboard Layout */
    .dashboard {
      display: flex;
      justify-content: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-top: 10px;
    }
    fieldset {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 15px 15px;
      text-align: right;
      background: #fafafa;
    }
    legend {
      font-weight: bold;
      padding: 0 5px;
      color: #333;
    }
    .row {
      margin-bottom: 12px;
      display: flex;
      align-items: center;
      justify-content: flex-end;
    }
    .row label {
      margin-right: 10px;
      font-size: 15px;
    }
    .row input {
      width: 60px;
      padding: 6px;
      font-size: 16px;
      border: 1px solid #ccc;
      border-radius: 4px;
      text-align: center;
    }
    input[disabled] { background: #e9ecef; color: #6c757d; }
    
    /* Custom Arrow Buttons matching the reference */
    .btn-arrow {
      background: #33ccff;
      color: white;
      font-size: 24px;
      border: 2px solid #009acd;
      border-radius: 6px;
      padding: 10px 15px;
      cursor: pointer;
    }
    .btn-arrow:active { background: #009acd; }
    
    .btn-dice {
      font-size: 32px;
      background: transparent;
      border: none;
      cursor: pointer;
      padding: 5px;
    }
    .btn-dice:active { transform: scale(0.95); }

    #status { font-weight: bold; margin-top: 10px; color: #6c757d; }
  </style>
</head>
<body>

  <h2>Insect Bio-Robotics Panel</h2>

  <div class="panel">
    <button class="btn-connect" onclick="connectToBoard()">Connect to DIALOG-PRPH</button>
    <p id="status">Status: Disconnected</p>
    <p id="gamepadStatus">Gamepad: Not Detected (Press any button to wake)</p>
  </div>

  <div class="panel">
    <div class="dashboard">
      
      <!-- Frequency Column (Updated Layout) -->
      <fieldset style="display: flex; align-items: center; gap: 15px;">
        <legend>Frequency Settings</legend>
        <div>
          <div class="row"><label>Right Ant. (Hz):</label><input id="freq-right" type="number" value="70"></div>
          <div class="row"><label>Left Ant. (Hz):</label><input id="freq-left" type="number" value="60"></div>
          <div class="row"><label>Cerci (Hz):</label><input id="freq-cerci" type="number" value="70"></div>
        </div>
        <div style="display: flex; gap: 8px; align-items: center;">
          <button class="btn-arrow" onclick="changeAllFreq(10)">⬆️</button>
          <button class="btn-arrow" onclick="changeAllFreq(-10)">⬇️</button>
          <button class="btn-dice" title="Randomize (Placeholder)">🎲</button>
        </div>
      </fieldset>

      <!-- Duration Column -->
      <fieldset>
        <legend>Duration Settings</legend>
        <div class="row"><label>Right Ant. (ms):</label><input id="dur-right" type="number" value="500" disabled></div>
        <div class="row"><label>Left Ant. (ms):</label><input id="dur-left" type="number" value="500" disabled></div>
        <div class="row"><label>Cerci (ms):</label><input id="dur-cerci" type="number" value="500" disabled></div>
      </fieldset>

      <!-- Pulse Width Column -->
      <fieldset>
        <legend>Pulse Width Settings</legend>
        <div class="row"><label>Right Ant. (ms):</label><input id="pw-right" type="number" value="30"></div>
        <div class="row"><label>Left Ant. (ms):</label><input id="pw-left" type="number" value="5"></div>
        <div class="row"><label>Cerci (ms):</label><input id="pw-cerci" type="number" value="3"></div>
      </fieldset>
      
    </div>
  </div>

  <script>
    let rxCharacteristic = null;
    let stimTimeout = null;
    
    // --- UI LOGIC ---
    function changeAllFreq(delta) {
      ['freq-right', 'freq-left', 'freq-cerci'].forEach(id => {
        let el = document.getElementById(id);
        let val = parseInt(el.value) + delta;
        el.value = Math.max(1, Math.min(255, val)); // Clamp 1-255 Hz
      });
    }

    function calculateDuty(freq, pw_ms) {
      let duty = (pw_ms * freq) / 10;
      return Math.max(1, Math.min(100, Math.round(duty))); // Clamp 1-100%
    }

    // --- BLE LOGIC ---
    async function connectToBoard() {
      const statusText = document.getElementById("status");
      try {
        statusText.innerText = "Scanning...";
        const device = await navigator.bluetooth.requestDevice({
          filters: [{ name: 'DIALOG-PRPH' }],
          optionalServices: ['6e400001-b5a3-f393-e0a9-e50e24dcca9e']
        });

        statusText.innerText = "Connecting...";
        const server = await device.gatt.connect();
        const service = await server.getPrimaryService('6e400001-b5a3-f393-e0a9-e50e24dcca9e');
        rxCharacteristic = await service.getCharacteristic('6e400002-b5a3-f393-e0a9-e50e24dcca9e');

        statusText.innerText = "Status: Connected & Ready";
        statusText.style.color = "#28a745";
      } catch (err) {
        statusText.innerText = "Error: " + err;
        statusText.style.color = "red";
      }
    }

    async function sendStimulation(target) {
      if (!rxCharacteristic) {
        console.warn("Cannot send: Board not connected.");
        return;
      }

      let pinNum = 0;
      if (target === "right") pinNum = 0; // P04
      if (target === "left") pinNum = 1;  // P05
      if (target === "cerci") pinNum = 4; // Dual Fire (P04 & P06)

      const freq = parseInt(document.getElementById(`freq-${target}`).value) || 1;
      const pw = parseInt(document.getElementById(`pw-${target}`).value) || 1;
      const duration = parseInt(document.getElementById(`dur-${target}`).value) || 500;

      const duty = calculateDuty(freq, pw);
      const payload = new Uint8Array([pinNum, freq, duty]);

      try {
        await rxCharacteristic.writeValueWithoutResponse(payload);

        if (stimTimeout) clearTimeout(stimTimeout);

        stimTimeout = setTimeout(async () => {
          const offPayload = new Uint8Array([pinNum, freq, 0]);
          await rxCharacteristic.writeValueWithoutResponse(offPayload);
        }, duration);

      } catch (err) {
        console.error("Send Error:", err);
      }
    }

    // --- GAMEPAD (CONTROLLER) & KEYBOARD LOGIC ---
    let controllerIndex = null;
    let buttonStates = { right: false, left: false, cerci: false };

    window.addEventListener("gamepadconnected", (e) => {
      controllerIndex = e.gamepad.index;
      const gpStatus = document.getElementById("gamepadStatus");
      gpStatus.innerText = `Gamepad: Connected (${e.gamepad.id})`;
      gpStatus.style.color = "#28a745";
      requestAnimationFrame(pollGamepad);
    });

    window.addEventListener("gamepaddisconnected", (e) => {
      if (e.gamepad.index === controllerIndex) {
        controllerIndex = null;
        const gpStatus = document.getElementById("gamepadStatus");
        gpStatus.innerText = "Gamepad: Disconnected";
        gpStatus.style.color = "#6c757d";
      }
    });

    function pollGamepad() {
      if (controllerIndex !== null) {
        const gp = navigator.getGamepads()[controllerIndex];
        if (gp) {
          checkButton(gp.buttons[1], 'right'); // B or Circle
          checkButton(gp.buttons[2], 'left');  // X or Square
          checkButton(gp.buttons[3], 'cerci'); // Y or Triangle
        }
        requestAnimationFrame(pollGamepad);
      }
    }

    function checkButton(button, target) {
      if (button && button.pressed) {
        if (!buttonStates[target]) {
          buttonStates[target] = true;
          sendStimulation(target);
        }
      } else {
        buttonStates[target] = false;
      }
    }
    
    // Test mapping for keyboard 
    window.addEventListener("keydown", (e) => {
      if (e.code === "ArrowRight" && !buttonStates.right) { buttonStates.right = true; sendStimulation("right"); }
      if (e.code === "ArrowLeft" && !buttonStates.left) { buttonStates.left = true; sendStimulation("left"); }
      if (e.code === "ArrowUp" && !buttonStates.cerci) { buttonStates.cerci = true; sendStimulation("cerci"); }
    });
    
    window.addEventListener("keyup", (e) => {
      if (e.code === "ArrowRight") buttonStates.right = false;
      if (e.code === "ArrowLeft") buttonStates.left = false;
      if (e.code === "ArrowUp") buttonStates.cerci = false;
    });
  </script>
</body>
</html>
